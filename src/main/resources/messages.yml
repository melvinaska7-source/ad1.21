# ==========================================
#            DailyArtifacts messages.yml
# ==========================================
# Все сообщения игрокам. Поддерживает legacy &#HEX и MiniMessage одновременно.
# Плейсхолдеры зависят от конкретного сообщения (указаны в комментарии).

# Префикс, подставляется в {prefix} везде ниже. Пока экспериментальный — меняй как хочешь.
prefix: "&#85195A&l[&#812162&lD&#7D286A&la&#793072&li&#75377A&ll&#703F82&ly &#684E92&lA&#64559A&lr&#605DA1&lt&#5C64A9&li&#586CB1&lf&#5473B9&la&#4F7BC1&lc&#4B82C9&lt&#478AD1&ls&r] "

messages:
  no-permission: "{prefix}&cУ тебя нет прав на это."
  reload-success: "{prefix}&aКонфигурация перезагружена."
  player-only: "{prefix}&cЭту команду может использовать только игрок."
  unknown-command: "{prefix}&7Используй: &f/ad menu&7, &f/ad settings&7, &f/ad reload"

  # {amount} — сколько сдано, {item} — название предмета, {price} — сколько получено денег
  turn-in-success: "{prefix}&aСдано {amount}x {item} &7за &f{price}$"

  # {given} и {limit} — текущий/максимальный лимит по этому предмету
  limit-reached: "{prefix}&cВы уже всё сдали за сегодня! ({given}/{limit})"

  no-economy: "{prefix}&cЭкономика не найдена. Обратитесь к администратору."
  not-enough-items: "{prefix}&cУ тебя нет этого предмета в инвентаре."

  settings-saved: "{prefix}&aСписок артефактов сохранён."
  settings-reset: "{prefix}&eСписок артефактов очищен."
  item-added: "{prefix}&aПредмет добавлен в список возможных артефактов."
  item-removed: "{prefix}&7Предмет удалён из списка возможных артефактов."

  # {value} — введённое игроком значение
  enter-price-prompt: "{prefix}&eНапиши в чат новую цену для этого предмета (число). Напиши &ccancel&e для отмены."
  enter-limit-prompt: "{prefix}&eНапиши лимит в чат. Напиши &ccancel&e для отмены."
  enter-update-time-prompt: "{prefix}&eНапиши время, например &f1h&e, &f12h&e или &f7d&e. Напиши &ccancel&e для отмены."
  enter-count-prompt: "{prefix}&eНапиши количество от &f1 &eдо &f5&e. Напиши &ccancel&e для отмены."
  value-updated: "{prefix}&aЗначение обновлено: &f{value}"
  invalid-number: "{prefix}&cЭто не похоже на число. Попробуй ещё раз."
  artifacts-refreshed: "{prefix}&aАртефакты дня обновлены! Новый набор выбран."

