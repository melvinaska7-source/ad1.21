# ==========================================
#             DailyArtifacts menu.yml
# ==========================================
# Внешний вид /ad menu и /ad settings.
# Слоты нумеруются с 0 (0 = верхний левый угол).

menu:
  title: "&#812162&lАртефакты дня"
  size: 45          # 9, 18, 27, 36, 45 или 54

  # Слоты, в которые ставятся сегодняшние артефакты (по порядку).
  # Должно быть слотов не меньше, чем artifact-count.max в config.yml.
  artifact-slots: [11, 13, 15, 20, 24]

  # Слот с "часами" (таймер до следующего обновления).
  clock-slot: 40
  clock-item: CLOCK
  clock-name: "&#684E92&l⏳ До обновления"
  clock-lore:
    - ""
    - "&7Осталось: &f{time}"

  # Декоративная рамка из стекла по краям меню.
  border:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    # Если true — рамка ставится по всем свободным слотам, кроме artifact-slots и clock-slot.
    fill-empty: true

item-display:
  # {name} — ванильное имя предмета, {price} — цена, {limit} — лимит,
  # {given} — сколько уже сдано, {left} — сколько осталось до лимита, {time} — время до обновления.
  name: "&#4B82C9&l{name}"
  lore:
    - ""
    - "&7Цена за 1 шт: &a{price}$"
    - "&7Лимит на сдачу: &f{limit}"
    - "&7Сдано: &e{given}/{limit}"
    - ""
    - "&fЛКМ &7— сдать 1 шт"
    - "&fShift+ЛКМ &7— сдать всё"
  lore-limit-reached-line: "&c&lВы уже всё сдали за сегодня! ({given}/{limit})"

settings-menu:
  # Первый экран /ad settings. Здесь НЕ показываются предметы.
  title: "&#812162&lНастройки артефактов"
  size: 27

  buttons:
    loot:
      slot: 11
      material: CHEST
      name: "&#6D4487&lНастройка лута"
      lore:
        - ""
        - "&7Добавление предметов, цена и лимит."
        - "&8Нажми, чтобы открыть."

    update:
      slot: 13
      material: CLOCK
      name: "&#6D4487&lОбновление артефактов"
      lore:
        - ""
        - "&7Настройка минимального и максимального"
        - "&7времени между обновлениями."
        - "&8Нажми, чтобы открыть."

    count:
      slot: 15
      material: NETHER_STAR
      name: "&#6D4487&lКоличество артефактов"
      lore:
        - ""
        - "&7Настройка количества предметов,"
        - "&7которые выбираются за один период."
        - "&8Нажми, чтобы открыть."

  # Отдельное меню настройки лута.
  loot-title: "&#812162&lНастройка лута"
  loot-size: 54

  update-title: "&#812162&lОбновление артефактов"
  update-size: 27
  update-buttons:
    min:
      slot: 11
      name: "&e&lМинимальное время"
    max:
      slot: 15
      name: "&e&lМаксимальное время"

  count-title: "&#812162&lКоличество артефактов"
  count-size: 27
  count-buttons:
    min:
      slot: 11
      name: "&e&lМинимальное количество"
    max:
      slot: 15
      name: "&e&lМаксимальное количество"

  # Кнопки именно меню настройки лута.
  loot-buttons:
    save:
      slot: 45
      material: LIME_DYE
      name: "&a&lСохранить"
    reset:
      slot: 49
      material: BARRIER
      name: "&c&lСбросить"
    help:
      slot: 53
      material: BOOK
      name: "&e&lИнструкция"
      lore:
        - "&7Shift+ЛКМ по предмету в инвентаре — добавить"
        - "&7ЛКМ по предмету в меню — лимит +1"
        - "&7ПКМ по предмету в меню — лимит -1"
        - "&7Shift+ЛКМ по предмету в меню — удалить"
        - "&7Shift+ПКМ по предмету в меню — изменить цену"
        - "&7Колёсико по предмету — изменить лимит"
