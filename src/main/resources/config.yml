# ==========================================
#            DailyArtifacts config.yml
# ==========================================
# Основные глобальные настройки плагина.
# Список предметов настраивается в items.yml
# Оформление меню — в menu.yml
# Все тексты игрокам — в messages.yml

# Сколько сегодняшних артефактов выбирается случайно (уникальные, без повторов).
# Если активных предметов (enabled: true в items.yml) меньше, чем min/max —
# плагин НЕ упадёт, а выберет столько, сколько есть, и напишет предупреждение в консоль.
artifact-count:
  min: 1
  max: 5

# Как часто обновляются артефакты (старые сгорают, прогресс всех игроков по ним сбрасывается).
# Формат: число + буква (s = секунды, m = минуты, h = часы, d = дни).
# Реальный период обновления — случайное значение между min и max.
# Минимум 1 час, максимум 7 дней (можно менять на своё усмотрение).
update-time:
  min: 1h
  max: 7d

# Значения по умолчанию для новых предметов, добавленных через /ad settings
# (Shift+ЛКМ по предмету в инвентаре). Их можно поменять сразу же в самом меню настроек.
defaults:
  price: 100
  limit: 64

# ==========================================
#        ФОРМАТ ОСТАВШЕГОСЯ ВРЕМЕНИ
# ==========================================
# mode: format1 или format2
#
# format1: день + час.
#   Если остался только час без дней — показывается только час.
#   Если меньше часа — используется less-than-hour.
#
# format2: день + час + минуты (полная детализация).
#   Может показать час+минуты, либо только минуты, если дней/часов не осталось.
#   Если меньше минуты — используется less-than-minute.
time-format:
  mode: format1

  format1:
    both: "{days}д {hours}ч"        # когда есть и дни, и часы
    days-only: "{days}д"            # когда часов 0, но дни есть
    hours-only: "{hours}ч"          # когда дней 0
    less-than-hour: "< часа"

  format2:
    full: "{days}д {hours}ч {minutes}м"
    hours-minutes: "{hours}ч {minutes}м"
    minutes-only: "{minutes}м"
    less-than-minute: "< минуты"

# ==========================================
#                  ЗВУКИ
# ==========================================
sounds:
  enabled: true
  # Любое допустимое имя Bukkit/Paper Sound enum, например LEVEL_UP, WITHER_AMBIENT и т.д.
  success: ENTITY_PLAYER_LEVELUP
  limit-reached: ENTITY_VILLAGER_NO
  volume: 1.0
  pitch: 1.0

# ==========================================
#                PERMISSIONS
# ==========================================
# permission_mode:
#   simple — проверяется только OP / не OP (значения settings/menu ниже игнорируются
#            и заменяются на op/deop логику).
#   pex    — проверка через PermissionsEx (OP ИЛИ указанная нода/группа).
#   lp     — проверка через LuckPerms (OP ИЛИ указанная нода/группа).
#
# В режимах pex/lp можно указать несколько групп/нод через запятую.
permissions:
  permission_mode: simple

  # Используется только когда permission_mode: simple
  settings: op      # op или deop
  menu: deop        # op или deop

  # Используются только когда permission_mode: pex или lp
  # Нода вида dailyartifacts.settings/dailyartifacts.menu уже доступна всегда через plugin.yml,
  # здесь можно перечислить ГРУППЫ, которым доступ выдаётся автоматически (кроме OP).
  settings-groups: [admin, staff]
  menu-groups: [default, admin, vip, premium, staff]

# ==========================================
#              ЦВЕТОВОЙ ФОРМАТ
# ==========================================
# Поддерживаются оба формата одновременно в любом тексте (config/items/menu/messages):
#  - legacy HEX:  &#RRGGBB  (можно комбинировать с &l, &o и т.д.)
#  - MiniMessage: <gradient:#RRGGBB:#RRGGBB>текст</gradient>, <bold>, <red> и т.д.
color-format:
  legacy-hex: true
  minimessage: true
